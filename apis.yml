aid: elorian-ai
name: Elorian AI
description: 'Elorian AI Inc is a Palo Alto, California frontier AI research company
  founded in 2025 and emerged from stealth in April 2026, building foundation models
  for visual reasoning — models that process visual input directly rather than first
  converting imagery into text, with the stated goal of advancing toward "visual AGI"
  for applications in architecture, automotive, manufacturing and robotics. It was
  co-founded by Andrew Dai (CEO, formerly Google Brain and DeepMind, first author of
  the 2015 work introducing LM pretraining followed by supervised fine-tuning, co-lead
  of GLaM and PaLM 2 pretraining), Yinfei Yang (Chief Multimodal Architect, formerly
  Apple Foundation Model Multimodal and co-creator of ALIGN at Google Research) and
  Seth Neel (formerly a Harvard professor researching data-centric generative AI),
  with Dustin Tran (formerly xAI post-training lead) as Chief Reasoning Architect.
  The company raised a $55M seed round at a reported $300M valuation with Nvidia and
  Menlo Ventures as strategic partners, and was named to the Forbes Next Billion-Dollar
  Startups 2026 list. As of this profiling pass Elorian is pre-product: its site states
  the first foundation visual thinking model will be released "later this year" and
  offers only an early-access waitlist. It publishes no developer portal, no API
  documentation, no machine-readable specification, and no public API host.'
